name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: young_go_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: young_go_ci
      DB_USERNAME: root
      DB_PASSWORD: ci
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: intl, mbstring, bcmath, gd, zip, sockets, pcntl, posix, redis, pdo_mysql, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: php artisan migrate --seed --force
      - name: Verify Horizon processes a Redis job
        shell: bash
        env:
          CI_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          cat > "$RUNNER_TEMP/horizon-smoke.php" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          dispatch(static function (): void {
              Illuminate\Support\Facades\Cache::store('redis')->put('ci:horizon:processed', true, 60);
          })->onConnection('redis');
          PHP
          php "$RUNNER_TEMP/horizon-smoke.php"
          php artisan horizon > "$RUNNER_TEMP/horizon.log" 2>&1 &
          worker=$!
          trap 'kill -TERM "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if [ "$(docker exec "$CI_REDIS_CONTAINER" redis-cli -n 1 --scan --pattern '*ci:horizon:processed')" != "" ]; then
              echo 'Horizon processed the Redis job.'
              exit 0
            fi
            kill -0 "$worker" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/horizon.log"
          exit 1
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Tests and coverage
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/pest --exclude-group=browser --parallel --coverage
      - run: php artisan app:check-translations
      - run: php artisan app:check-rtl
      - run: composer audit --locked
      - run: npm ci
      - run: npm run build
