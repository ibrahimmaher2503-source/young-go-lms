name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: young_go_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: young_go_ci
      DB_USERNAME: root
      DB_PASSWORD: ci
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: intl, mbstring, bcmath, gd, zip, sockets, pcntl, posix, redis, pdo_mysql, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: php artisan migrate --seed --force
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Tests and coverage
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/pest --exclude-group=browser --parallel --coverage
      - run: php artisan app:check-translations
      - run: php artisan app:check-rtl
      - run: composer audit --locked
      - run: npm ci
      - run: npm run build
